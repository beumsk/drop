<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Drop</title>
    <link rel="stylesheet" type="text/css" href="index.css" />
  </head>
  <body>
    <canvas id="game-canvas" width="320" height="560"></canvas>

    <div class="bottom-bar">
      <button id="btn-left" class="control-btn">◀</button>
      <p id="score-display">Score: 0</p>
      <button id="btn-right" class="control-btn">▶</button>
    </div>

    <div id="start-ui" class="overlay-ui">
      <h1>DROP</h1>
      <button id="start-btn" class="menu-btn">Start</button>
    </div>

    <div id="game-over-ui" class="overlay-ui">
      <h1>GAME OVER</h1>
      <p id="final-score"></p>
      <button id="restart-btn" class="menu-btn">Restart</button>
    </div>

    <div id="pause-ui" class="overlay-ui">
      <h1>PAUSE</h1>
      <button id="resume-btn" class="menu-btn">Resume</button>
    </div>

    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
