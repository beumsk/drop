<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Drop</title>
    <link rel="stylesheet" type="text/css" href="index.css" />
  </head>
  <body>
    <canvas id="gameCanvas" width="320" height="560"></canvas>
    <div id="ui">
      <p id="scoreDisplay">Score: 0</p>
    </div>

    <div id="mobile-controls">
      <button id="btn-left" class="control-btn">◀</button>
      <button id="btn-right" class="control-btn">▶</button>
    </div>

    <div id="startUI" class="overlayUI">
      <h1>DROP</h1>
      <button id="startBtn" class="menuBtn">Start</button>
    </div>

    <div id="gameOverUI" class="overlayUI">
      <h1>EVAPORATED!</h1>
      <button id="restartBtn" class="menuBtn">Restart</button>
    </div>

    <div id="pauseUI" class="overlayUI">
      <h1>PAUSE</h1>
      <button id="resumeBtn" class="menuBtn">Resume</button>
    </div>

    <script type="module" src="./src/index.ts"></script>
  </body>
</html>
